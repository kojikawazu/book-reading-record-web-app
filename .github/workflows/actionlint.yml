name: actionlint

# ワークフロー自身の静的解析。方針は .claude/rules/github-actions.md を正とする。
#
# ci.yml から独立させ、パスフィルタをかけずに全 PR で常に実行する。検査は数秒で
# 終わるのに対し、「ワークフローを変えたときだけ動かす」ための判定ジョブ（changes）
# を経由させると判定のほうが検査より高くつくため。常時起動なので必須チェックに
# 指定しても pending で詰まらない。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# このジョブにシークレットは渡さない。Docker Hub から取得したイメージを実行するため、
# 万一取得物が不正でも読み取り専用のチェックアウト以外に到達できないよう権限を絞る。
# （イメージは Makefile で digest まで固定しており、取得物のすり替えも検知される。）
permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      # actionlint は Git リポジトリの中から .github/workflows を探すため、
      # チェックアウトを必ず先に置く（リポジトリ外で実行するとエラー終了する）。
      - uses: actions/checkout@v7

      # コマンドの正本は Makefile の actionlint ターゲット（ローカルと同じものを呼ぶ）。
      # 公式イメージに shellcheck が同梱されているため、ランナーのプリインストールに
      # 依存せず run: の中身まで検査される。バージョンは Makefile の ACTIONLINT_IMAGE で
      # タグと digest の双方を固定している（Dependabot では更新されないため手で上げる）。
      - name: Run actionlint
        run: make actionlint
