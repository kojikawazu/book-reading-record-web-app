name: CI

# 発火方針は .claude/rules/github-actions.md を正とする。
#
# ワークフローレベルの paths / paths-ignore は使わない。必須チェック（required status
# check）に指定したジョブが「起動しない」と pending のまま完了せず、PR が永久にマージ
# できなくなるため。代わりに changes ジョブで変更範囲を判定し、各ジョブは常に起動して
# ジョブレベル if: で中身だけスキップする（skipped は必須チェックとして成功扱いになる）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR への連続 push で古い実行をキャンセルする（CD を追加する際は false にすること）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 既定の広い権限に依存せず、読み取りのみを明示する。
permissions:
  contents: read

jobs:
  # 変更範囲の判定。code / docs / workflows は独立した判定であり、排他ではない。
  # 実装とドキュメントを同一 PR で更新する運用（.claude/rules/documentation.md）のため、
  # code と docs が両方 true になる PR が正常系。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # code は「除外リスト」で書く。対象リストにすると新しいディレクトリが増えた
          # ときに黙ってテストが走らなくなるため、安全側に倒す。
          # docs は逆に「対象リスト」。走りすぎても害が小さく、走らない方が問題になる。
          filters: |
            code:
              - '!(docs/**|.claude/**|**/*.md|LICENSE)'
            docs:
              - 'docs/**'
              - '.claude/**'
              - '**/*.md'
            workflows:
              - '.github/workflows/**'

  # 静的ゲート: lint / 型 / フォーマット。最速で全 PR の門番になる。
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 型チェック（tsc）は Prisma Client の型を要求するため generate しておく。
      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder?schema=public

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

  # UT（単体・jsdom・外部 I/O モック）。DB 不要で高速。
  ut:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run UT
        run: pnpm test

  # IT（結合・node・実 Postgres）。docker-compose.test.yml の使い捨てコンテナに対して実行する。
  # 共有 Supabase プロジェクトには接続しない（.claude/rules/database.md）。
  it:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # IT はテストコンテナへ db push し @prisma/client を実行時 import するため generate が必要。
      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/book_record_test?schema=public

      # test:it が docker compose 起動(--wait) → prisma db push → Vitest まで一括で行う。
      - name: Run IT
        run: pnpm test:it

      - name: Stop test DB
        if: always()
        run: pnpm test:it:down

  # E2E / シナリオ（Playwright / Chromium・local レーン）。受け入れ Case 1-18。
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: front/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_REPOSITORY_DRIVER: local

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_REPOSITORY_DRIVER: local

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ドキュメントレーン: markdown の構文検査とリンク切れ検査。
  # テスト・ビルドは回さない（発火条件も実行内容もコードとは別物）。
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 対象・除外・有効ルールは .markdownlint-cli2.jsonc を単一の真実とする
      # （ローカルの `pnpm dlx markdownlint-cli2` と CI で同じ設定が効くようにする）。
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v20

      # リンク切れは --offline で内部リンクのみ検査する。外部 URL を叩くと相手先の
      # 一時的な障害やレート制限で CI が落ち、警告の常態化を招くため対象にしない。
      # .claude/ は隠しディレクトリのため、glob を明示して検査対象に含める。
      # base/ は Google AI Studio から取り込んだ参照用の生成物で、.gitignore 対象の
      # .env.local を参照している。本体の規約対象外なので markdownlint と同様に除外する。
      - name: Link check (internal only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --exclude-path base
            '**/*.md' '.claude/**/*.md'
          fail: true

  # ワークフロー自身の検証。構文ミス・存在しない式を早期に検出する。
  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 公式のインストールスクリプトを使う（バージョンタグの推測を避ける）。
      - name: Run actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
